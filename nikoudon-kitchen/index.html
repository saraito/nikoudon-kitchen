<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Niko Udon — Kitchen Guide</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <h1>Niko Udon</h1>
    <p class="subtitle">Kitchen Guide</p>
  </header>

  <nav class="tab-bar" role="tablist">
    <button class="tab active" data-tab="opening" role="tab" aria-selected="true">A · Open / Close</button>
    <button class="tab" data-tab="stock" role="tab" aria-selected="false">B · Stock</button>
    <button class="tab" data-tab="menu" role="tab" aria-selected="false">C · Menu</button>
  </nav>

  <main id="app">
    <section id="panel-opening" class="panel active" role="tabpanel"></section>
    <section id="panel-stock" class="panel" role="tabpanel" hidden></section>
    <section id="panel-menu" class="panel" role="tabpanel" hidden></section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
